<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Tambah Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-brand shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="card border-0 shadow-sm" style="max-width: 600px; margin: 0 auto;">
            <div class="card-body">
                <h2 class="h4 text-brand mb-3">Tambah Buku</h2>
                <form action="#" method="post">
                    <div class="mb-3">
                        <label for="judul" class="form-label font-weight-bold">Judul Buku</label>
                        <input type="text" class="form-control" id="judul" placeholder="Masukkan judul buku" required>
                    </div>
                    <div class="mb-3">
                        <label for="pengarang" class="form-label font-weight-bold">Pengarang</label>
                        <input type="text" class="form-control" id="pengarang" placeholder="Masukkan nama pengarang" required>
                    </div>
                    <div class="mb-3">
                        <label for="penerbit" class="form-label font-weight-bold">Penerbit</label>
                        <input type="text" class="form-control" id="penerbit" placeholder="Masukkan penerbit" required>
                    </div>
                    <button type="submit" class="btn btn-brand">Simpan</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted my-4">
        <small>&copy; 2026 SIMPUS-Mini. All rights reserved.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
